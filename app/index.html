  :root { --am:#FFD100; --bg:#111; --card:#1c1c1c; --linha:#2c2c2c; --txt:#eee; --fraco:#999; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* Precisa vir de um seletor forte: regra de ID com display: (ex. #scan) ganha do
     [hidden]{display:none} do navegador e deixa o elemento "escondido" na tela. */
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.4 "Buvera",system-ui,"Segoe UI",Roboto,sans-serif;
         padding-bottom:env(safe-area-inset-bottom); }
  header { position:sticky; top:0; background:var(--bg); padding:10px 12px;
           border-bottom:1px solid var(--linha); z-index:5; }
  .topo { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .topo b { color:var(--am); font-size:17px; }
  .topo small { color:var(--fraco); margin-left:auto; font-size:11px; }
  input, button { font:inherit; color:var(--txt); background:var(--card);
                  border:1px solid var(--linha); border-radius:8px; padding:11px 12px; }
  .linha { display:flex; gap:8px; }
  .linha input { flex:1; min-width:0; }
  .linha button { background:var(--am); color:#111; font-weight:700; border:0; padding:11px 18px; }
  .card { border-bottom:1px solid var(--linha); padding:12px; }
  .cab { display:flex; gap:10px; align-items:center; }
  .cab img { width:52px; height:52px; object-fit:cover; border-radius:6px; background:var(--card); flex:none; }
  .cab div { min-width:0; }
  .cab .n { font-weight:600; }
  .sku { color:var(--fraco); font-size:12px; }
  .contas { display:flex; gap:8px; margin-top:10px; }
  .conta { flex:1; background:var(--card); border-radius:8px; padding:9px 10px; }
  .conta .e { font-size:11px; color:var(--fraco); text-transform:uppercase; letter-spacing:.04em; }
  .conta .t { font-size:26px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
  .conta.sem .t { color:#ff6b6b; } .conta.tem .t { color:#4ade80; }
  .dep { font-size:12px; color:var(--fraco); display:flex; justify-content:space-between; gap:8px; }
  .dep b { color:var(--txt); font-weight:600; }
  .aviso { margin:10px 12px; padding:10px; border-radius:8px; background:#3a1c1c; color:#ffb4b4; font-size:13px; }
  .msg { padding:36px 16px; text-align:center; color:var(--fraco); }
  #trava { padding:60px 24px; text-align:center; }
  #trava input { width:100%; margin:16px 0 10px; }
  #trava button { width:100%; background:var(--am); color:#111; font-weight:600; border:0; }
  #erro { color:#ff6b6b; min-height:18px; font-size:13px; }
  .sair { padding:4px 8px; font-size:11px; }
  #cam { padding:11px 12px; font-size:17px; line-height:1; }   /* opcional: some sem suporte */
  #verPedido { padding:5px 10px; font-size:12px; }
  #verPedido span { background:var(--am); color:#111; border-radius:999px; padding:1px 6px;
                    font-weight:700; margin-left:2px; }
  .add { margin-top:10px; width:100%; background:var(--am); color:#111; border:0; font-weight:700; padding:10px; }
  .ver { margin-top:10px; width:100%; color:var(--am); border-color:var(--am); font-weight:600; padding:10px; }
  .marca { margin-top:10px; padding:12px; border-radius:8px; background:var(--card);
           font-weight:700; font-size:17px; text-align:center; }
  .marca.tem { color:#4ade80; } .marca.sem { color:#ff6b6b; }
  .barra { display:flex; gap:8px; align-items:center; padding:10px 12px;
           border-bottom:1px solid var(--linha); font-size:13px; color:var(--fraco); }
  .barra button { padding:7px 10px; font-size:13px; }
  .barra #voltar { margin-left:auto; }
  .item { display:flex; gap:10px; padding:12px; border-bottom:1px solid var(--linha); align-items:flex-start; }
  .item input[type=checkbox] { width:22px; height:22px; margin-top:2px; flex:none; accent-color:var(--am); }
  .item .d { flex:1; min-width:0; }
  .qtd { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .qtd button { width:38px; padding:6px 0; font-size:18px; line-height:1; }
  .qtd b { min-width:28px; text-align:center; font-size:17px; font-variant-numeric:tabular-nums; }
  .qtd .lixo { margin-left:auto; border-color:#5a2a2a; }
  .total { position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--linha);
           padding:14px 12px; padding-bottom:calc(14px + env(safe-area-inset-bottom));
           display:flex; justify-content:space-between; font-size:17px; font-weight:700; }
  #scan { position:fixed; inset:0; background:#000; z-index:20; display:flex;
          align-items:center; justify-content:center; }
  #scan video { width:100%; height:100%; object-fit:cover; }
  #scan .mira { position:absolute; width:74vw; max-width:320px; aspect-ratio:1;
                border:3px solid var(--am); border-radius:14px; }
  #scan .rodape { position:absolute; left:0; right:0; bottom:0; padding:16px;
                  padding-bottom:calc(16px + env(safe-area-inset-bottom));
                  display:flex; gap:12px; align-items:center; justify-content:space-between;
                  background:linear-gradient(transparent,#000c); color:var(--txt); }
</style>
</head>
<body>

<div id="trava">
  <h2 style="color:var(--am);margin:0">Estoque</h2>
  <input id="usuario" placeholder="usuário" autocomplete="username" enterkeyhint="next"
         autocapitalize="off" autocorrect="off" spellcheck="false">
  <input id="senha" type="password" placeholder="senha" autocomplete="current-password" enterkeyhint="go">
  <button id="entrar">Entrar</button>
  <div id="erro"></div>
</div>

<div id="app" hidden>
  <header>
    <div class="topo">
      <b>Estoque</b>
      <small id="quando"></small>
      <button id="verPedido">Pedido <span id="conta">0</span></button>
      <button class="sair" id="sair">sair</button>
    </div>
    <div class="linha" id="linhaBusca">
      <input id="busca" placeholder="SKU ou nome" enterkeyhint="search"
             autocapitalize="off" autocorrect="off" autocomplete="off">
      <button id="ir">Ver</button>
      <button id="cam" aria-label="Ler código pela câmera" title="Ler código pela câmera" hidden>📷</button>
    </div>
  </header>
  <div id="saida"><div class="msg">Digite o SKU ou o nome e toque em Ver.</div></div>

  <div id="pedido" hidden>
    <div class="barra">
      <label><input type="checkbox" id="todos"> todos</label>
      <button id="excluir">Excluir marcados</button>
      <button id="voltar">Buscar</button>
    </div>
    <div id="itens"></div>
    <div class="total" id="total"></div>
  </div>
</div>

<div id="scan" hidden>
  <video id="video" playsinline muted></video>
  <div class="mira"></div>
  <div class="rodape"><span id="scanmsg">aponte para o código</span><button id="fechar">fechar</button></div>
</div>

<script>
// URL do Worker que fala com a Olist (npx wrangler deploy imprime ela).
const PROXY = "https://estoque-olist.dutech.workers.dev";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const brl = n => (n || 0).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});

// Uma so montagem do cabecalho: quem entra e "usuario:senha", em toda chamada.
const cabecalho = () => ({authorization: `Bearer ${localStorage.usuario || ""}:${localStorage.senha || ""}`});

async function consultar(q) {
  const r = await fetch(`${PROXY}/?q=${encodeURIComponent(q)}`,
                        {headers: cabecalho(), cache: "no-store"});
  if (r.status === 401) throw new Error("senha");
  if (!r.ok) throw new Error("proxy " + r.status);
  return r.json();
}

function cartao(it) {
  // Saldo de cada empresa fica lado a lado e NUNCA somado: sao CNPJs diferentes, e ha
  // deposito com o mesmo nome nos dois. Somar inventaria estoque que nao existe.
  // Sem "contas" a busca trouxe muitos resultados e o saldo so vem no toque.
  const contas = it.contas ? `<div class="contas">${Object.entries(it.contas).map(([empresa, c]) => `
    <div class="conta ${c.total > 0 ? "tem" : "sem"}">
      <div class="e">${esc(empresa)}</div><div class="t">${c.total}</div>
      ${Object.entries(c.depositos).map(([d, s]) =>
        `<div class="dep"><span>${esc(d)}</span><b>${s}</b></div>`).join("")}
    </div>`).join("")}</div>`
    : it.disponivel !== undefined
      ? `<div class="marca ${it.disponivel ? "tem" : "sem"}">${it.disponivel ? "✓ Disponível" : "Sem estoque"}</div>`
      : `<button class="ver" data-saldo="${esc(it.codigo)}">Ver estoque</button>`;
  return `<div class="card">
    <div class="cab">
      <img loading="lazy" src="../fotos/${encodeURIComponent(it.codigo)}.jpg"
           onerror="this.style.visibility='hidden'">
      <div><div class="n">${esc(it.nome)}</div>
           <div class="sku">${esc(it.codigo)} · ${brl(it.preco)}</div></div>
    </div>
    ${contas}
    <button class="add" data-add="${esc(it.codigo)}">+ Adicionar ao pedido</button>
  </div>`;
}

// Uma chamada por empresa, so para o produto tocado.
async function verSaldo(cod, botao) {
  const it = ultimos.get(cod);
  if (!it) return;
  botao.textContent = "consultando...";
  try {
    const partes = await Promise.all(Object.entries(it.ids || {}).map(async ([conta, id]) => {
      const r = await fetch(`${PROXY}/?saldo=${encodeURIComponent(id)}&conta=${encodeURIComponent(conta)}`,
                            {headers: cabecalho(), cache: "no-store"});
      if (!r.ok) throw new Error("proxy " + r.status);
      return [conta, await r.json()];
    }));
    // Cliente recebe {disponivel}; equipe recebe {saldo} com quantidade e depositos.
    if (partes.every(([, j]) => j.saldo === undefined))
      it.disponivel = partes.some(([, j]) => j.disponivel);
    else
      it.contas = Object.fromEntries(partes.filter(([, j]) => j.saldo).map(([c, j]) => [c, j.saldo]));
    botao.closest(".card").outerHTML = cartao(it);      // repinta so este cartao
  } catch (e) {
    botao.textContent = "não deu, tocar de novo";
  }
}

// --- pedido do cliente. Funcoes puras (recebem e devolvem a lista) para o testa.mjs
// conseguir rodar a conta sem navegador.
function addItem(lista, prod) {
  const j = lista.find(i => i.codigo === prod.codigo);
  if (j) return lista.map(i => i === j ? {...i, qtd: i.qtd + 1} : i);
  return [...lista, {codigo: prod.codigo, nome: prod.nome, preco: prod.preco, qtd: 1, sel: false}];
}
// "-" nunca zera: quem tira o produto da lista e a lixeira, senao um toque a mais apaga item.
const mudarQtd = (lista, cod, d) =>
  lista.map(i => i.codigo === cod ? {...i, qtd: Math.max(1, i.qtd + d)} : i);
const marcar = (lista, cod, sel) => lista.map(i => i.codigo === cod ? {...i, sel} : i);
const removerItem = (lista, cod) => lista.filter(i => i.codigo !== cod);
const excluirMarcados = lista => lista.filter(i => !i.sel);
const totalPedido = lista => ({
  itens: lista.reduce((s, i) => s + i.qtd, 0),
  valor: lista.reduce((s, i) => s + i.preco * i.qtd, 0),
});

async function buscar() {
  const q = $("#busca").value.trim();
  if (q.length < 2) return;
  verBusca();
  $("#saida").innerHTML = '<div class="msg">consultando a Olist...</div>';
  try {
    const r = await consultar(q);
    ultimos = new Map(r.itens.map(i => [i.codigo, i]));
    $("#quando").textContent = new Date(r.em).toLocaleTimeString("pt-BR");
    $("#saida").innerHTML =
      (r.avisos.length ? `<div class="aviso">${esc(r.avisos.join(" · "))}</div>` : "") +
      (r.truncado ? '<div class="msg">a Olist devolve no máximo 100 por busca — refine se faltar algum</div>' : "") +
      (r.itens.length ? `<div class="msg">${r.itens.length} produto${r.itens.length === 1 ? "" : "s"}</div>`
                        + r.itens.map(cartao).join("")
                      : '<div class="msg">nada encontrado</div>');
  } catch (e) {
    if (e.message === "senha") {          // senha trocada no proxy no meio do uso
      delete localStorage.senha; delete localStorage.usuario;
      $("#app").hidden = true; $("#trava").hidden = false;
      return ($("#erro").textContent = "seu acesso mudou, entre de novo");
    }
    $("#saida").innerHTML = `<div class="aviso">sem resposta: ${esc(e.message)}.
      Estoque so existe ao vivo — sem internet nao da para consultar.</div>`;
  }
}

// Valida a senha no proxy antes de entrar. Busca vazia nao chega na Olist, entao o
// teste e de graca — e sem ele a senha errada so apareceria depois, como um salto
// mudo de volta para esta tela.
async function entrar(usuario, senha) {
  $("#erro").textContent = "verificando...";
  try {
    const r = await fetch(`${PROXY}/?q=`, {headers: {authorization: `Bearer ${usuario}:${senha}`},
                                           cache: "no-store"});
    if (r.status === 401) return ($("#erro").textContent = "usuário ou senha errados");
    if (!r.ok) return ($("#erro").textContent = `o proxy respondeu ${r.status}`);
  } catch { return ($("#erro").textContent = "sem internet"); }
  localStorage.usuario = usuario;
  localStorage.senha = senha;
  $("#erro").textContent = "";
  $("#trava").hidden = true; $("#app").hidden = false;
  salvarPedido();                       // repinta o contador com o pedido que ficou salvo
  if (!daUrl()) $("#busca").focus();
}

// .../app/#1097-104 — a camera nativa do celular so sabe abrir link, entao o QR pode
// levar essa URL e a consulta ja acontece sozinha ao abrir.
function daUrl() {
  const codigo = limparCodigo(decodeURIComponent(location.hash.slice(1)));
  if (!codigo) return false;
  $("#busca").value = codigo;
  buscar();
  return true;
}

// --- tela do pedido. Fica no localStorage porque um atendimento e interrompido o tempo
// todo: fechar o app no meio da venda nao pode perder a lista que o cliente ja pediu.
let pedido = [], ultimos = new Map();
try { pedido = JSON.parse(localStorage.pedido || "[]"); } catch { pedido = []; }

function salvarPedido() {
  localStorage.pedido = JSON.stringify(pedido);
  const t = totalPedido(pedido);
  $("#conta").textContent = t.itens;
  if (!$("#pedido").hidden) pintarPedido();
}

function pintarPedido() {
  const t = totalPedido(pedido);
  $("#itens").innerHTML = pedido.length ? pedido.map(i => `
    <div class="item">
      <input type="checkbox" data-sel="${esc(i.codigo)}" ${i.sel ? "checked" : ""}
             aria-label="marcar ${esc(i.nome)}">
      <div class="d">
        <div>${esc(i.nome)}</div>
        <div class="sku">${esc(i.codigo)} · ${brl(i.preco)} un · <b>${brl(i.preco * i.qtd)}</b></div>
        <div class="qtd">
          <button data-menos="${esc(i.codigo)}" aria-label="tirar um">−</button>
          <b>${i.qtd}</b>
          <button data-mais="${esc(i.codigo)}" aria-label="somar um">+</button>
          <button class="lixo" data-lixo="${esc(i.codigo)}" aria-label="remover do pedido">🗑</button>
        </div>
      </div>
    </div>`).join("") : '<div class="msg">Nenhum produto no pedido. Busque e toque em "+ Adicionar ao pedido".</div>';
  $("#total").innerHTML = `<span>${t.itens} ${t.itens === 1 ? "item" : "itens"}</span><span>${brl(t.valor)}</span>`;
  $("#todos").checked = pedido.length > 0 && pedido.every(i => i.sel);
}

const verBusca = () => { $("#pedido").hidden = true; $("#saida").hidden = false;
                         $("#linhaBusca").hidden = false; };
const verPedido = () => { $("#saida").hidden = true; $("#linhaBusca").hidden = true;
                          $("#pedido").hidden = false; pintarPedido(); };

$("#verPedido").onclick = () => $("#pedido").hidden ? verPedido() : verBusca();
$("#voltar").onclick = verBusca;
$("#todos").onchange = ev => { pedido = pedido.map(i => ({...i, sel: ev.target.checked})); salvarPedido(); };
$("#excluir").onclick = () => {
  const n = pedido.filter(i => i.sel).length;
  if (!n) return alert("Marque os produtos que quer excluir.");
  if (!confirm(`Excluir ${n} produto${n === 1 ? "" : "s"} do pedido?`)) return;
  pedido = excluirMarcados(pedido); salvarPedido();
};

// Um listener por tela em vez de um por botao: a lista e redesenhada a cada toque.
$("#saida").onclick = ev => {
  const ver = ev.target.closest("[data-saldo]");
  if (ver) return verSaldo(ver.dataset.saldo, ver);
  const cod = ev.target.closest("[data-add]")?.dataset.add;
  if (!cod || !ultimos.has(cod)) return;
  pedido = addItem(pedido, ultimos.get(cod));
  salvarPedido();
  navigator.vibrate?.(30);
  ev.target.textContent = "✓ no pedido";
  setTimeout(() => { ev.target.textContent = "+ Adicionar ao pedido"; }, 900);
};
$("#itens").onclick = ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.mais) pedido = mudarQtd(pedido, d.mais, +1);
  else if (d.menos) pedido = mudarQtd(pedido, d.menos, -1);
  else if (d.lixo) pedido = removerItem(pedido, d.lixo);
  else return;
  salvarPedido();
};
$("#itens").onchange = ev => {
  const cod = ev.target.dataset.sel;
  if (cod) { pedido = marcar(pedido, cod, ev.target.checked); salvarPedido(); }
};

// --- leitura por camera. BarcodeDetector e nativo do navegador: sem biblioteca.
// Le o QR com o SKU e tambem o codigo de barras que ja vem impresso na embalagem.
const FORMATOS = ["qr_code", "ean_13", "ean_8", "code_128", "code_39"];

// O QR pode trazer o SKU puro ou a URL do app com #SKU — assim a camera nativa do
// celular, que so abre link, tambem cai na consulta certa.
function limparCodigo(txt) {
  const t = (txt || "").trim();
  if (!/^https?:\/\//i.test(t)) return t;
  try {
    const u = new URL(t);
    return (u.hash.slice(1) || u.pathname.split("/").filter(Boolean).pop() || "").trim();
  } catch { return t; }
}

async function escanear() {
  const suportados = await BarcodeDetector.getSupportedFormats();
  const detector = new BarcodeDetector({formats: FORMATOS.filter(f => suportados.includes(f))});
  let camera;
  try {
    camera = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
  } catch {
    return alert("Sem permissão para usar a câmera.");
  }
  const video = $("#video");
  video.srcObject = camera;
  await video.play();
  $("#scan").hidden = false;

  const parar = () => {
    clearInterval(timer);
    camera.getTracks().forEach(t => t.stop());
    $("#scan").hidden = true;
    video.srcObject = null;
  };
  $("#fechar").onclick = parar;
  // ponytail: varredura a cada 250ms; se ler devagar em etiqueta pequena, baixar o intervalo.
  const timer = setInterval(async () => {
    let achados = [];
    try { achados = await detector.detect(video); } catch { return; }
    if (!achados.length) return;
    const codigo = limparCodigo(achados[0].rawValue);
    if (!codigo) return;
    parar();
    navigator.vibrate?.(60);
    $("#busca").value = codigo;
    buscar();
  }, 250);
}

// A camera e um extra: o botao so aparece onde o navegador sabe ler codigo (Chrome/Android).
// Sem ele o app fica exatamente como antes — digitar SKU ou nome e tocar em Ver.
if ("BarcodeDetector" in window) { $("#cam").hidden = false; $("#cam").onclick = escanear; }
$("#entrar").onclick = () => ($("#usuario").value.trim() && $("#senha").value)
  ? entrar($("#usuario").value.trim(), $("#senha").value)
  : ($("#erro").textContent = "preencha usuário e senha");
$("#usuario").onkeydown = ev => { if (ev.key === "Enter") $("#senha").focus(); };
$("#senha").onkeydown = ev => { if (ev.key === "Enter") $("#entrar").click(); };
$("#ir").onclick = buscar;
$("#busca").onkeydown = ev => { if (ev.key === "Enter") { ev.target.blur(); buscar(); } };
$("#sair").onclick = () => { delete localStorage.senha; delete localStorage.usuario; location.reload(); };
window.onhashchange = () => { if (!$("#app").hidden) daUrl(); };

if (PROXY.includes("SEU-SUBDOMINIO"))
  document.body.innerHTML = '<div class="msg">Falta publicar o proxy e pôr a URL dele em PROXY, no index.html.</div>';
else if (localStorage.usuario && localStorage.senha) entrar(localStorage.usuario, localStorage.senha);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
