<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devoluções</title>
<meta name="theme-color" content="#000000">
<script src="../tema.js"></script>
<link rel="apple-touch-icon" href="../app/icone-192.png">
<meta name="robots" content="noindex">
<style>
 /* visual do painel de devolucoes que rodava no PC do Gabriel */
 * { box-sizing: border-box; }
 body { font-family: Arial, sans-serif; margin: 0; background: #f7f6f3; color: #222; display: flex; min-height: 100vh; }
 nav { width: 190px; background: #000; color: #fff; padding: 20px 0; flex-shrink: 0; position: sticky; top: 0; height: 100vh; }
 nav .marca { font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #FFD100; padding: 0 20px 20px; border-bottom: 1px solid #222; margin-bottom: 10px; }
 nav a { display: block; color: #ddd; text-decoration: none; padding: 10px 20px; font-size: 14px; cursor: pointer; }
 nav a.on, nav a:hover { background: #FFD100; color: #000; font-weight: bold; }
 nav .volta { color: #888; font-size: 12px; margin-top: 14px; border-top: 1px solid #222; padding-top: 14px; }
 main { flex: 1; padding: 18px 24px; min-width: 0; }
 h1 { margin: 0 0 12px; font-size: 22px; }
 .cx { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 14px; }
 .cx + .cx, .grade + .cx { margin-top: 16px; }
 .grade > div > .cx + .cx, .grade > div > .aviso { margin-top: 16px; }
 .cx > b:first-child { display: block; margin: 0 0 8px; font-size: 15px; }
 .erro { color: #9a4b00; } p.erro, div.cx.erro { background: #fff4e5; border: 1px solid #f0c36d; padding: 8px 12px; border-radius: 6px; }
 .ok { background: #e6f4ea; border: 1px solid #1a7f37; color: #1a7f37; font-weight: bold; padding: 8px 12px; border-radius: 6px; }
 .aviso { background: #fff4e5; border: 1px solid #f0c36d; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
 .mini { color: #777; font-size: 12px; margin-top: 3px; }
 label { display: block; margin: 10px 0 3px; color: #555; font-size: 12px; }
 input, select, textarea { padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; font: 14px Arial, sans-serif; width: 100%; background: #fff; color: #222; }
 textarea { font-size: 13px; resize: vertical; }
 button { background: #FFD100; color: #000; font-weight: bold; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 12px; }
 button:hover { background: #000; color: #FFD100; }
 button.sec { background: #eee; margin-left: 8px; }
 .busca { display: flex; gap: 8px; max-width: 720px; align-items: center; }
 .busca input { flex: 1; } .busca button { margin: 0; white-space: nowrap; }
 #res { margin-top: 16px; }
 .grade { display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; align-items: start; }
 .campos { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 10px; margin: 6px 0; }
 table { border-collapse: collapse; width: 100%; }
 td, th { border: 1px solid #e0e0e0; padding: 6px 10px; text-align: left; font-size: 13px; vertical-align: top; }
 th { background: #fff6cc; }
 td.t:first-child { color: #777; width: 140px; }
 .num { font-family: monospace; white-space: nowrap; }
 .q { width: 64px !important; }
 .rol { max-height: 70vh; overflow: auto; margin: 0 -14px -14px; }
 table.l { white-space: nowrap; }
 table.l th { position: sticky; top: 0; text-transform: uppercase; font-size: 11px; color: #555; }
 table.l td, table.l th { border-left: none; border-right: none; padding: 6px 8px; }
 a.rma { font-family: monospace; background: #f4f4f4; border: 1px dashed #ccc; border-radius: 4px; padding: 2px 6px; color: #222; cursor: pointer; text-decoration: none; }
 a.rma:hover { background: #FFD100; }
 .selo { border-radius: 10px; padding: 2px 10px; font-size: 12px; font-weight: bold; background: #eee; }
 .selo.aprovado { background: #e3f4ea; color: #1a7f37; }
 .selo.recusado { background: #fff0e0; color: #9a4b00; }
 .selo.em-analise { background: #fff3cd; color: #9a6b00; }
 a.mini { background: #ffe600; color: #333; padding: 2px 8px; border-radius: 6px; font-weight: 600; text-decoration: none; display: inline-block; }
 @media (max-width: 760px) {
   body { display: block; }
   nav { width: auto; height: auto; position: static; display: flex; flex-wrap: wrap; padding: 8px; }
   nav .marca { border: 0; padding: 6px 12px; margin: 0; font-size: 18px; }
   nav a, nav .volta { padding: 8px 10px; margin: 0; border: 0; }
   main { padding: 14px 12px; }
   .grade, .campos { grid-template-columns: 1fr; }
 }
</style></head><body>

<nav>
  <div class="marca">LUMIA</div>
  <div id="abas"></div>
  <a href="../robo/?g=nfdev">NF DE DEVOLUÇÃO</a>
  <a href="painel.html">PAINEL</a>
  <a class="volta" href="../ecommerce/">‹ E-commerce</a>
</nav>

<main>
<div id="tela"></div>
</main>

<script>
const PROXY = "https://estoque-olist.dutech.workers.dev";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const cab = () => ({authorization: `Bearer ${localStorage.usuario || ""}:${localStorage.senha || ""}`, "content-type": "application/json"});
const $ = id => document.getElementById(id);
const tela = $("tela");
const reais = v => v == null || v === "" ? "" : Number(v).toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
const dataBR = v => /^\d{4}-\d{2}-\d{2}/.test(v || "") ? v.slice(8, 10) + "/" + v.slice(5, 7) + "/" + v.slice(0, 4) : (v || "");
// textos da mensagem para o ML (iguais aos do painel do Gabriel)
const LIM = 320;
const ALEG = {"Arrependimento": "disse que recebeu em boas condições e não quer mais o produto,", "Produto Incorreto": "alegou produto diferente do anunciado,",
  "Defeito": "alegou defeito,", "Avaria no Produto": "alegou produto avariado,", "Avaria no Transporte": "alegou avaria no transporte,", "Não foi Entregue": "alegou que não recebeu,"};
const PROB = {"Vácuo violado": "com a embalagem a vácuo violada. Sem o vácuo, o filamento absorve umidade, fica impróprio para uso e não tem mais condição de revenda.",
  "Sinais de uso": "com sinais de uso. O material foi manipulado, perdeu a qualidade e não tem mais condição de revenda.",
  "Produto trocado": "um produto diferente do que enviamos, que não tem condição de revenda.",
  "Produto danificado": "danificado, impróprio para uso e sem condição de revenda."};
const NOMES = {data_recebimento: "Data do recebimento", status: "Status", plataforma: "Plataforma", num_venda: "Nº venda", cliente: "Cliente",
  valor_venda: "Valor da venda", nf_origem: "NF de origem", nf_devolucao: "NF de devolução", custo_devolucao: "Custo da devolução", sku: "SKU",
  produto: "Produto", itens_problema: "Nº de itens com problema", motivo: "Motivo", resolucao: "Resolução", destino: "Destino do produto",
  data_conclusao: "Data da conclusão", operador: "Operador"};
let OP = null, aba = "iniciar", listas = {}, filtro = "";
try { aba = sessionStorage.devAba || "iniciar"; } catch {}

function telaLogin(aviso){
  tela.innerHTML = `<div class="cx">${aviso ? `<p class="erro">${esc(aviso)}</p>` : ""}
    <label>Usuário</label><input id="u" autocapitalize="none"><label>Senha</label><input id="s" type="password">
    <button onclick="entrar()">Entrar</button></div>`;
}
function entrar(){ localStorage.usuario = $("u").value.trim(); localStorage.senha = $("s").value; trocar(aba); }
async function api(q, corpo){
  let r;
  try { r = await fetch(PROXY + q, corpo ? {method: "POST", headers: cab(), body: JSON.stringify(corpo)} : {headers: cab(), cache: "no-store"}); }
  catch { return {erro: "sem conexão"}; }
  if (r.status === 401) { telaLogin("usuário ou senha inválidos"); return null; }
  if (r.status === 403) { tela.innerHTML = `<div class="cx erro">Seu usuário não abre as Devoluções.</div>`; return null; }
  return r.json().catch(() => ({erro: "resposta inválida do servidor"}));
}
const opts = (lista, atual, vazio) => (vazio !== undefined ? `<option value="">${vazio}</option>` : "") +
  lista.map(o => `<option ${o === atual ? "selected" : ""}>${esc(o)}</option>`).join("");

function desenhaAbas(){
  $("abas").innerHTML = [["iniciar", "INICIAR DEVOLUÇÃO"], ["dutech", "DEVOLUÇÕES Dutech"], ["lumia", "DEVOLUÇÕES Lumia"]]
    .map(([k, t]) => `<a class="${aba === k ? "on" : ""}" onclick="trocar('${k}')">${t}</a>`).join("");
}
async function trocar(k){
  aba = k; try { sessionStorage.devAba = k; } catch {}
  desenhaAbas();
  if (!(localStorage.usuario && localStorage.senha)) return telaLogin();
  if (k === "iniciar") return telaIniciar();
  tela.innerHTML = `<div class="cx">carregando...</div>`;
  const j = await api(`/?rma=lista&emp=${k}`);
  if (!j) return;
  if (j.erro) return tela.innerHTML = `<div class="cx erro">${esc(j.erro)}</div>`;
  OP = j.opcoes; listas[k] = j.linhas;
  desenhaLista(k);
}

// --- iniciar devolucao ---
function telaIniciar(aviso, ok){
  tela.innerHTML = `<h1>Iniciar devolução</h1>${aviso ? `<p class="erro">${esc(aviso)}</p>` : ""}${ok ? `<p class="ok">${esc(ok)}</p>` : ""}
    <div class="busca"><input id="venda" inputmode="numeric" placeholder="Nº da venda (Mercado Livre / Shopee)" onkeydown="if(event.key==='Enter')buscar()">
    <button onclick="buscar()">Buscar</button></div><div id="res"></div>`;
  $("venda").focus();
}
let V = null;
async function buscar(){
  const n = $("venda").value.replace(/\D/g, "");
  if (!n) return;
  $("res").innerHTML = `<div class="cx">procurando nas duas Olists e no Mercado Livre...</div>`;
  const [j, m] = await Promise.all([api(`/?rma=venda&n=${n}`), api(`/meli/logistica/ml-venda?numero=${n}`)]);
  if (!j) return;
  if (j.erro) return $("res").innerHTML = `<div class="cx erro">${esc(j.erro)}</div>`;
  OP = j.opcoes; V = j.venda;
  const ml = m && !m.erro ? m.ml : null, L = j.lancadas, f = L[0] || {};
  const qtdDe = (it, i) => { const l = L.find(x => x.sku === it.sku); return l ? l.itens_problema : (V.itens.length === 1 ? it.quantidade : 0); };
  const motivo = f.motivo || (ml && ml.motivo) || "";
  $("res").innerHTML = `${L.length ? `<div class="aviso">Essa venda já está lançada (RMA ${L.map(x => x.rma).join(", ")}). Os campos vêm de lá e o botão atualiza essas mesmas linhas.</div>` : ""}
  <div class="grade"><div>
    <div class="cx"><b>Venda · ${esc(V.empresa.toUpperCase())}</b><table>
      <tr><td class="t">Recebimento</td><td class="t">${L.length ? dataBR(f.data_recebimento) : "hoje"}</td></tr>
      <tr><td class="t">Plataforma</td><td class="t">${esc(V.plataforma)}</td></tr>
      <tr><td class="t">Cliente</td><td class="t">${esc(V.cliente)}</td></tr>
      <tr><td class="t">NF de origem</td><td class="t">${esc(V.nf_origem)}${V.chave_origem ? `<div class="mini">Chave: ${esc(V.chave_origem)}</div>` : ""}</td></tr>
      <tr><td class="t">Operador</td><td class="t">${esc(L.length ? f.operador : localStorage.usuario)}</td></tr></table></div>
    ${ml ? `<div class="cx"><b>Mercado Livre (${esc(ml.conta)})</b><table>${ml.reclamacao ? `
      <tr><td class="t">Motivo do cliente</td><td class="t">${esc(ml.motivo_texto || "-")}</td></tr>
      <tr><td class="t">Reclamação</td><td class="t">${ml.encerrada ? `encerrada em ${esc(ml.encerrada_em)}, a favor do ${esc(ml.a_favor)}${ml.cobertura ? " (com cobertura do ML)" : ""}` : "em aberto"} · ${esc(ml.situacao)}</td></tr>
      ${ml.retorno ? `<tr><td class="t">Produto</td><td class="t">${esc(ml.retorno)}</td></tr>` : ""}
      ${ml.dinheiro ? `<tr><td class="t">Dinheiro</td><td class="t">${esc(ml.dinheiro)}</td></tr>` : ""}`
      : `<tr><td class="t">Reclamação</td><td class="t">nenhuma no Mercado Livre (pedido: ${esc(ml.pedido)})</td></tr>`}</table></div>`
      : V.plataforma === "Mercado Livre" ? `<div class="aviso">Não consegui buscar essa venda no Mercado Livre.</div>` : ""}
    ${V.plataforma === "Mercado Livre" ? `<div class="cx"><b>Mensagem para o Mercado Livre</b>
      <select id="problema" onchange="montar()">${Object.keys(PROB).map(p => `<option>${esc(p)}</option>`).join("")}</select>
      <textarea id="msg" rows="5" maxlength="${LIM}" oninput="contar()" style="margin-top:8px"></textarea>
      <div class="mini"><span id="conta"></span> <button class="sec" style="padding:4px 10px;margin:4px 0 0 8px" onclick="navigator.clipboard.writeText($('msg').value)">Copiar</button></div></div>` : ""}
  </div>
  <div class="cx"><b>Itens com problema</b>
    <table>${V.itens.map((it, i) => `<tr><td class="t">${esc(it.sku)}<div class="mini">${esc(it.descricao)} · vendido ${it.quantidade} · ${reais(it.valor)}</div></td>
      <td class="t num"><input class="q" type="number" min="0" max="${it.quantidade}" id="q${i}" value="${qtdDe(it, i)}" onchange="montar()"></td></tr>`).join("")}</table>
    <div class="campos">
      <div><label>Status</label><select id="f_status">${opts(OP.status, f.status || OP.status[0])}</select></div>
      <div><label>Motivo da devolução</label><select id="f_motivo" onchange="montar()">${opts(OP.motivos, motivo, "")}</select></div>
      <div><label>Destino do produto</label><select id="f_destino">${opts(OP.destinos, f.destino, "(ainda não)")}</select></div>
      <div><label>Resolução</label><select id="f_resolucao">${opts(OP.resolucoes, f.resolucao, "(ainda não)")}</select></div>
      <div><label>Custo da devolução (R$)</label><input id="f_custo_devolucao" value="${esc(String(f.custo_devolucao ?? 0).replace(".", ","))}"></div>
      <div><label>NF de devolução</label><input id="f_nf_devolucao" value="${esc(f.nf_devolucao || "")}" placeholder="vazio se ainda não tem"></div>
      <div><label>Data da conclusão</label><input type="date" id="f_data_conclusao" value="${esc(f.data_conclusao || "")}"></div>
    </div>
    <button onclick="lancar()">${L.length ? "Atualizar devolução" : "Lançar devolução"}</button></div></div>`;
  montar();
}
function contar(){ const m = $("msg"); if (m) $("conta").textContent = m.value.length + "/" + LIM; }
function montar(){
  const m = $("msg"); if (!m) return;
  const q = V.itens.reduce((s, _, i) => s + (+$("q" + i).value || 0), 0) || 1;
  m.value = `O comprador ${ALEG[$("f_motivo").value] || "abriu reclamação,"} mas devolveu ${q > 1 ? "os " + q + " rolos" : "o rolo"} ${PROB[$("problema").value]} Solicito o reembolso.`;
  contar();
}
async function lancar(){
  const form = {};
  for (const c of ["status", "motivo", "destino", "resolucao", "custo_devolucao", "nf_devolucao", "data_conclusao"]) form[c] = $("f_" + c).value;
  if (!form.motivo) return alert("escolha o motivo da devolução");
  const qtds = V.itens.map((_, i) => +$("q" + i).value || 0);
  const j = await api("/?rma=lancar", {numero: V.numero, qtds, form});
  if (!j) return;
  if (j.erro) return alert(j.erro);
  telaIniciar(null, `Lançado: RMA ${j.rmas.join(", ")} (${V.empresa.toUpperCase()})`);
}

// --- lista e edicao ---
function desenhaLista(k){
  const l = listas[k].slice().reverse().filter(r => !filtro || r.status === filtro);
  tela.innerHTML = `<h1>Devoluções ${k === "lumia" ? "Lumia" : "Dutech"}</h1><div class="cx"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <b>Lista de RMAs – ${k.toUpperCase()}</b><span class="mini" style="margin:0">${l.length} item(ns)</span>
      <select style="width:auto" onchange="filtro=this.value;desenhaLista('${k}')">${opts(OP.status, filtro, "Todos os status")}</select></div>
    <div class="rol"><table class="l"><tr><th>RMA</th><th>Status</th><th>Pedido</th><th>Plataforma</th><th>Cliente</th><th>SKU / Produto</th>
      <th class="num">Valor venda</th><th class="num">Custo dev.</th><th>NF dev.</th><th>Status ML</th></tr>
    ${l.map(r => `<tr><td><a class="rma" onclick="editar('${k}', ${r.n})">${r.rma}</a><div class="mini">${dataBR(r.data_recebimento)}</div></td>
      <td><span class="selo ${String(r.status || "").toLowerCase().replace(/\s/g, "-").replace("á", "a")}">${esc(r.status || "-")}</span></td>
      <td>${esc(r.num_venda)}${r.plataforma === "Mercado Livre" ? `<div><a class="mini" style="margin-top:4px" target="_blank" rel="noopener" href="https://vendedores.mercadolivre.com.br/vendas/${esc(r.num_venda)}/detalhe">ver no ML</a></div>` : ""}</td>
      <td>${esc(r.plataforma)}</td><td>${esc(r.cliente)}</td><td>${esc(r.sku)}<div class="mini">${esc(String(r.produto || "").slice(0, 34))}</div></td>
      <td class="num">${reais(r.valor_venda)}</td><td class="num">${reais(r.custo_devolucao)}</td><td>${esc(r.nf_devolucao || "")}</td>
      <td class="mini" ${r.status === "Em análise" && r.plataforma === "Mercado Livre" ? `data-venda="${esc(r.num_venda)}">...` : ">"}</td></tr>`).join("")}
    </table></div></div>`;
  statusML();
}
async function statusML(){
  for (const td of document.querySelectorAll("td[data-venda]")) {     // um por vez, so os "Em analise"
    const m = await api(`/meli/logistica/ml-venda?numero=${td.dataset.venda}`);
    if (!td.isConnected) return;
    td.textContent = m && m.ml ? m.ml.situacao : "não consegui consultar";
  }
}
function editar(k, n){
  const r = listas[k].find(x => x.n === n);
  const sel = {status: OP.status, plataforma: OP.plataformas, motivo: OP.motivos, resolucao: OP.resolucoes, destino: OP.destinos};
  tela.innerHTML = `<div class="cx"><b>RMA ${r.rma} · ${k.toUpperCase()}</b>
    <div class="campos">${Object.entries(NOMES).map(([c, t]) => `<div><label>${t}</label>${sel[c]
      ? `<select id="e_${c}">${opts(sel[c], r[c], "")}</select>`
      : `<input id="e_${c}" ${c.startsWith("data_") ? 'type="date"' : ""} value="${esc(c.startsWith("data_") && !/^\d{4}-/.test(r[c] || "") ? "" : (r[c] ?? ""))}">
         ${c.startsWith("data_") && r[c] && !/^\d{4}-/.test(r[c]) ? `<div class="erro mini">estava escrito "${esc(r[c])}" na planilha: corrija</div>` : ""}`}</div>`).join("")}</div>
    <p class="mini">${r.atualizado_por ? `última alteração: ${esc(r.atualizado_por)}${r.atualizado_em ? " em " + new Date(r.atualizado_em).toLocaleString("pt-BR") : ""}` : ""}</p>
    <button onclick="salvar('${k}', ${n})">Salvar</button><button class="sec" onclick="desenhaLista('${k}')">Voltar à lista</button></div>`;
}
async function salvar(k, n){
  const r = listas[k].find(x => x.n === n), campos = {};
  for (const c of Object.keys(NOMES)) {
    const v = $("e_" + c).value, antes = r[c] ?? "";
    if (String(v) !== String(antes) && !(c.startsWith("data_") && v === "" && !/^\d{4}-/.test(antes))) campos[c] = v;
  }
  if (!Object.keys(campos).length) return desenhaLista(k);
  const j = await api("/?rma=editar", {emp: k, n, campos});
  if (!j) return;
  if (j.erro) return alert(j.erro);
  trocar(k);
}
desenhaAbas(); trocar(aba);

</script>
</body></html>
