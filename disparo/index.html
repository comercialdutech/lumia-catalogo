<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disparo</title>
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="../tema.css">
<script src="../tema.js"></script>
<link rel="apple-touch-icon" href="../app/icone-192.png">
<meta name="robots" content="noindex">
<style>


 *{box-sizing:border-box}
 body{font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fundo);color:var(--texto);
      margin:0;padding:22px 16px 70px;max-width:620px;margin-inline:auto}
 h1{font-size:20px;margin:0 0 2px}
 .sub{color:var(--suave);font-size:13px;margin:0 0 18px}
 label{display:block;margin:12px 0 4px;color:var(--rotulo);font-size:13px}
 input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--borda);background:var(--campo);color:var(--texto);font:16px system-ui}
 button{background:var(--am);color:var(--sobre-am);font-weight:700;border:0;border-radius:10px;
        padding:13px 20px;font-size:16px;cursor:pointer;margin-top:12px;width:100%}
 button.sec{background:var(--sec);color:var(--sec-txt);font-weight:600}
 button:disabled{opacity:.5;cursor:default}
 .cx{background:var(--cx);border:1px solid var(--borda);border-radius:13px;padding:15px;margin-top:16px}
 .erro{color:var(--erro)}.mini{color:var(--suave);font-size:12px}
 .estado{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700}
 .bolha{width:11px;height:11px;border-radius:50%;flex:none}
 .on{background:var(--ok)}.off{background:var(--suave)}
 .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
 .num{font-size:24px;font-weight:700;color:var(--am-txt);line-height:1.15}
 .rot{color:var(--suave);font-size:12px}
 table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
 td{padding:6px 0;border-bottom:1px solid var(--linha)}
 td:last-child{text-align:right;color:var(--suave);white-space:nowrap}
 .volta{color:var(--suave);text-decoration:none;font-size:13px}
 .dupla{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 12px}
 .numero .topo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
 .numero .topo b{font-size:16px}
 .numero p.mini{margin:4px 0 0}
 .barra{height:6px;background:var(--sec);border-radius:3px;margin-top:12px;overflow:hidden}
 .barra i{display:block;height:100%;background:var(--am)}
 .tag{font-size:11px;color:var(--sec-txt);background:var(--sec);border-radius:5px;padding:2px 6px;margin-right:6px}
</style></head><body>

<a class="volta" href="../balcao/">‹ Balcão</a>
<h1>Disparo de campanha</h1>
<p class="sub">Roda na nuvem: continua com o computador desligado</p>

<div id="tela"></div>

<script>
(() => {
const PROXY = "https://estoque-olist.dutech.workers.dev/dash";
const $ = id => document.getElementById(id);
const tela = $("tela");
const cabecalho = () => ({authorization: `Bearer ${localStorage.usuario || ""}:${localStorage.senha || ""}`});

function telaLogin(aviso){
  tela.innerHTML = `<div class="cx">${aviso ? `<p class="erro">${aviso}</p>` : ""}
    <label>Usuário</label><input id="u" autocapitalize="none">
    <label>Senha</label><input id="s" type="password">
    <button id="entrar">Entrar</button></div>`;
  $("entrar").onclick = () => { localStorage.usuario = $("u").value.trim(); localStorage.senha = $("s").value; ver(); };
}

async function chamar(rota){
  let r;
  try { r = await fetch(PROXY + rota, {headers: cabecalho()}); }
  catch { return {erro: "sem conexão"}; }
  if (r.status === 401) { telaLogin("usuário ou senha inválidos"); return null; }
  if (r.status === 403) { tela.innerHTML = `<div class="cx erro">seu usuário não pode ver o disparo</div>`; return null; }
  return await r.json();
}

// Dois numeros desde 12/10: clientes (reposicao, VIP) no LUMIA3D; ativacao no PROSPEC, em aquecimento.
// Cada um tem teto proprio; a nuvem manda `hoje_lumia`/`hoje_prospec` e `fila_lumia` separados.
const NUMEROS = {20913: "LUMIA3D", 22605: "PROSPEC"};

function cartaoNumero(nome, fone, oque, hoje, limite, fila){
  const pct = Math.min(100, Math.round(100 * hoje / Math.max(1, limite)));
  return `<div class="cx numero">
    <div class="topo"><b>${nome}</b><span class="mini">${fone}</span></div>
    <p class="mini">${oque}</p>
    <div class="grade">
      <div><div class="num">${hoje}/${limite}</div><div class="rot">enviadas hoje</div></div>
      <div><div class="num">${fila}</div><div class="rot">na fila</div></div>
    </div>
    <div class="barra"><i style="width:${pct}%"></i></div>
    <p class="mini">${hoje >= limite ? "Teto do dia atingido: volta amanhã às " + e_de : `Restam ${limite - hoje} hoje.`}</p>
  </div>`;
}
let e_de = "08:00";

function desenhar(e){
  e_de = e.de;
  const limL = Number(e.limite), limP = Number(e.limite_prospec || 30);
  const hojeL = e.hoje_lumia ?? e.hoje, hojeP = e.hoje_prospec ?? 0;
  const filaL = e.fila_lumia ?? 0, filaP = Math.max(0, e.fila - filaL);
  const ativNoProspec = (e.ativacao_conexao || "prospec") === "prospec";
  tela.innerHTML = `<div class="cx">
    <div class="estado"><span class="bolha ${e.ligado ? "on" : "off"}"></span>
      ${e.ligado ? (e.janela ? "Disparando" : "Ligado, fora da janela") : "Pausado"}</div>
    <p class="mini">Janela ${e.de} às ${e.ate} · agora são ${e.agora} · em cada número, uma mensagem a cada
      ${Math.round(e.pausa_min / 60)} a ${Math.round(e.pausa_max / 60)} min</p>
    <button id="alterna" class="${e.ligado ? "sec" : ""}">${e.ligado ? "Pausar os dois números" : "Iniciar disparo"}</button>
    <p class="mini">${e.ligado
      ? "Pausar interrompe na hora nos dois números; o que já saiu não volta."
      : "Ao iniciar, a primeira mensagem sai em até 1 minuto."}</p>
  </div>
  <div class="dupla">
    ${cartaoNumero("LUMIA3D", "(44) 9 8832-0238",
      ativNoProspec ? "Clientes: reposição e VIP" : "Clientes e ativação", hojeL, limL, ativNoProspec ? filaL : e.fila)}
    ${cartaoNumero("LUMIA3D - PROSPEC", "(44) 9 9155-9771",
      ativNoProspec ? "Ativação da base · em aquecimento" : "Parado: a ativação voltou pro LUMIA3D", hojeP, limP, ativNoProspec ? filaP : 0)}
  </div>
  <div class="cx">
    <div class="grade">
      <div><div class="num">${e.total}</div><div class="rot">total enviadas</div></div>
      <div><div class="num">${e.erros}</div><div class="rot">erros</div></div>
    </div>
  </div>
  <div class="cx">
    <div class="rot">organizar os leads</div>
    <p class="mini">Quem respondeu ganha a etiqueta da campanha e vai pro kanban de Ativação;
      quem não respondeu vai pra coluna Não Responde e tem a conversa fechada.</p>
    <button id="organiza" class="sec" ${e.pedido ? "disabled" : ""}>
      ${e.pedido ? "Pedido na fila…" : "Organizar leads agora"}</button>
    <p class="mini">${e.pedido
      ? "O computador pega esse pedido no próximo check (até 15 min) e leva ~40 min lendo as conversas."
      : (e.organizado ? "Última organização: " + e.organizado : "Roda no computador do escritório, por isso não é na hora.")}</p>
  </div>
  ${e.ultimos.length ? `<div class="cx"><div class="rot">últimos envios</div><table>${
    e.ultimos.map(u => `<tr><td>${u.nome || u.fone}</td><td><span class="tag">${NUMEROS[u.conexao] || "LUMIA3D"}</span> ${(u.enviado_em || "").slice(11, 16)}</td></tr>`).join("")
  }</table></div>` : ""}`;
  $("alterna").onclick = async () => {
    $("alterna").disabled = true;
    const novo = await chamar(e.ligado ? "/disparo/pausar" : "/disparo/ligar");
    if (novo) desenhar(novo);
  };
  $("organiza").onclick = async () => {
    $("organiza").disabled = true;
    const novo = await chamar("/disparo/organizar");
    if (novo) desenhar(novo);
  };
}

async function ver(){
  tela.innerHTML = `<div class="cx">carregando…</div>`;
  const e = await chamar("/disparo");
  if (e && e.erro) { tela.innerHTML = `<div class="cx erro">${e.erro}</div>`; return; }
  if (e) desenhar(e);
}

(localStorage.usuario && localStorage.senha) ? ver() : telaLogin();
setInterval(() => { if (localStorage.usuario && !document.hidden) ver(); }, 60000);
})();
</script></body></html>
